
server.port=8080
# Check for Actuator information on https://docs.spring.io/spring-boot/docs/current/reference/html/production-ready-features.html
management.server.port = 9000
# changes the endpoint from /actuator/{id} to /courseActuator/{id}
management.endpoints.web.base-path=/courseActuator
#If you want to map endpoints to a different path, you can use the management.endpoints.web.path-mapping property.
#The following example remaps /actuator/health to /courseActuator/healthcheck:
#management.endpoints.web.path-mapping.health=courseActuator/healthcheck
management.endpoints.enabled-by-default=true
management.endpoint.shutdown.enabled=true
management.endpoint.beans.enabled=true
management.endpoint.health.enabled=true
#This shows more details about the endpoint
management.endpoint.health.show-details=always
#Enable all the endpoints with care. Below way we expose the endpoints which can be accessed via Rest clients.
#management.endpoints.web.exposure.include=*
#Alternatively, we could list endpoints which should be enabled. If want to shytdown application via Shutdown endpoint then add that to below.
#Then send the post request to shutdown endpoint & it will shutdown the application.
#metrics gives the list of individual metric which you can query further to get the specific details like- 
#http://localhost:9000/courseActuator/metrics/jvm.memory.max
management.endpoints.web.exposure.include=beans,info,health,metrics,features
management.endpoint.beans.cache.time-to-live=10s
#Below data is used by 'info' health endpoint
info.app.name=Courses
info.app.description=This is sample SpringBoot application to check few features about SpringBoot quickly
info.app.version=1.0.0

spring.security.user.name=admin
spring.security.user.password=password
spring.security.user.roles=SUPERUSER

management.endpoint.health.roles=ACTUATOR
